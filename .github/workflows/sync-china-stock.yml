name: Automated 24/7 China PUBG Stock Sync (Zero-DB Free Mode)

on:
  schedule:
    # Run every 6 hours automatically (4 times a day: 07:00, 13:00, 19:00, 01:00 TH)
    # Balanced to keep within GitHub Actions free tier (720 / 2,000 min) while keeping 35,000+ accounts ultra-fresh
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Allows manual trigger button from GitHub Actions UI at any time

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run China Stock Sync Engine (Tiered Markup)
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || 'sima-shop-a674f' }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY || 'AIzaSyDjg9hzjBB1Nh3rZmoLgHEBhiovGteLXhk' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CNY_RATE_THB: '5.2'
          CNY_RATE_VND: '3700'
          MARKUP_MODE: 'tiered'
          MARKUP_THRESHOLD: '100000'
          MARKUP_TIER1_PERCENT: '10'
          MARKUP_TIER2_PERCENT: '13'
        run: |
          node scripts/syncChinaStock.js --all

      - name: Commit & push updated china_stock.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add new-react-app/public/data/china_stock.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(stock): auto-update China inventory" && git push)
