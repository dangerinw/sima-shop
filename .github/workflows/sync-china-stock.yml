name: Automated 24/7 China PUBG Stock Sync

on:
  schedule:
    # Run every 30 minutes automatically 24/7
    - cron: '*/30 * * * *'
  workflow_dispatch:
    # Allows manual trigger button from GitHub Actions UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run China Stock Sync Engine
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || 'sima-shop-a674f' }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY || 'AIzaSyDjg9hzjBB1Nh3rZmoLgHEBhiovGteLXhk' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SYNC_PAGES: '3'
          CNY_RATE_THB: '5.2'
          CNY_RATE_VND: '3700'
          MARKUP_PERCENT: '15'
        run: |
          node scripts/syncChinaStock.js
