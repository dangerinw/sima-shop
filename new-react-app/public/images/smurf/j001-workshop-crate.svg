<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0b2e"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#140826"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="400" cy="200" r="160" fill="#a855f7" opacity="0.2" filter="url(#glow)"/>
  <g transform="translate(400, 190)">
    <!-- 3D Crate Body -->
    <path d="M-90,-40 L0,-90 L90,-40 L90,60 L0,110 L-90,60 Z" fill="#2e1065" stroke="#c084fc" stroke-width="4"/>
    <path d="M0,-90 L0,110" stroke="#a855f7" stroke-width="3"/>
    <path d="M-90,-40 L0,10 L90,-40" stroke="#a855f7" stroke-width="3"/>
    <polygon points="0,-90 90,-40 0,10 -90,-40" fill="#4c1d95" opacity="0.8"/>
    <polygon points="0,10 90,-40 90,60 0,110" fill="#3b0764"/>
    <polygon points="-90,-40 0,10 0,110 -90,60" fill="#2e1065"/>
    <!-- Glowing Lock -->
    <circle cx="0" cy="15" r="22" fill="#fbbf24" stroke="#fff" stroke-width="3" filter="url(#glow)"/>
    <rect x="-6" y="8" width="12" height="15" rx="3" fill="#1e1b4b"/>
  </g>
  <!-- Text Overlays -->
  <rect x="230" y="320" width="340" height="40" rx="10" fill="#7e22ce" opacity="0.3" stroke="#a855f7" stroke-width="1.5"/>
  <text x="400" y="346" font-family="Arial, sans-serif" font-weight="900" font-size="20" fill="#fef08a" text-anchor="middle" letter-spacing="3">WORKSHOP &amp; HUNTER CHEST</text>
  <text x="400" y="390" font-family="Arial, sans-serif" font-weight="700" font-size="14" fill="#a855f7" text-anchor="middle" letter-spacing="1">PUBG STEAM • 24H AUTO DELIVERY • ฿29</text>
</svg>